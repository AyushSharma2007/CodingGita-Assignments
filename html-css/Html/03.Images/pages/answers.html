<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <img src="../Flower.jpg" alt="flower" width="200px">
    <img src="../../../photos/logo.png" width="200px">
    <img src="../images/banner.jpg" width="200px" alt="Bruce Banner">
    <img src="../photo.png" width="200px">
    <img src="../images/nature.jpg" width="300px" alt="Beautiful nature view" height="200px" title="click to view full size">
    <img src="../images/banner.jpg" width="200px" alt="Bruce Banner" loading="lazy">
    <img src="../Flower.jpg" alt="flower" width="200px" loading="eager">
    <img src="../../../photos/logo.png" width="200px" loading="auto">
    <p>The browser will use its own internal default behavior to determine whether to load the image immediately or defer it until the user scrolls near it.</p>
    <img src="large.png" 
    srcset="small.png 480w, medium.png 800w, large.png 1200w" 
    alt="Responsive flower" sizes="100vw"
    style="width: 100%; height: auto;">
    <img src="../images/banner.jpg"
    srcset="large.png 1200px,
    medium.png 800px"
    alt="Hulku" width="500px" height="300px" loading="lazy" title="hulku re">
    <br><br>
    <img src="../assests/logo.png" loading="eager" alt="logo" width="250px">
    <img src="images/products/shoe.jpg" loading="lazy" alt="shoe" width="250px">


</body> 
</html>
